---
layout: default
title: 北榮人事室AI助理
---

<!-- Web-LLM 相容性 Shim -->
<script>if (typeof window.createRequire === 'undefined') window.createRequire = () => () => ({});</script>
<!-- 工具專屬樣式 -->
<link rel="stylesheet" href="{{ '/web-LLM/css/chat.css' | relative_url }}">

<!-- 使用 calc 計算扣除 Navbar 與 Footer 後的可用高度 -->
<div class="flex flex-col mx-auto w-full max-w-5xl bg-slate-900 text-slate-100 shadow-2xl relative mt-16 sm:mt-8 rounded-none sm:rounded-xl overflow-hidden" style="height: calc(100dvh - 100px); min-height: 500px;">
    
    <!-- 頂部控制列 -->
    <header class="bg-slate-800 border-b border-slate-700 p-3 sm:p-4 shadow-md flex-shrink-0 z-10">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400 sm:w-8 sm:h-8">
                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect>
                    <line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line>
                    <line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line>
                </svg>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-wide leading-tight">北榮人事室AI助理 (建議使用桌機/筆電的Chrome瀏覽器)</h1>
                    <h1 class="text-lg sm:text-l font-bold tracking-wide leading-tight">建議使用桌機/筆電的Chrome瀏覽器</h1>
                    <p class="text-[10px] sm:text-xs text-slate-400">100%瀏覽器本地端儲存與執行</p>
                    <p class="text-[10px] sm:text-xs text-slate-400">首次使用需等待下載AI模型到您的設備</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <select id="model-select" class="flex-1 min-w-[130px] sm:w-64 bg-slate-700 border border-slate-600 text-white text-xs sm:text-sm rounded-lg focus:ring-blue-500 block p-2.5 sm:p-3 outline-none h-[42px] sm:h-[46px]">
                    {% for model in site.data.llm_models %}
                        <option value="{{ model.value }}">{{ model.label }}</option>
                    {% endfor %}
                </select>
               
                <button id="clear-btn" class="flex-shrink-0 p-2.5 sm:p-3 bg-slate-700 hover:bg-red-600/80 border border-slate-600 rounded-lg text-slate-300 transition-colors h-[42px] sm:h-[46px] flex items-center justify-center" title="清除對話紀錄">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
               
                <button id="settings-btn" class="flex-shrink-0 p-2.5 sm:p-3 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-slate-300 transition-colors h-[42px] sm:h-[46px] flex items-center justify-center" title="參數設定">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>

                <button id="load-btn" class="flex-shrink-0 flex items-center justify-center gap-1.5 sm:gap-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 text-white px-3 sm:px-4 rounded-lg text-xs sm:text-sm font-medium transition-colors h-[42px] sm:h-[46px]">
                    <span id="load-btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </span>
                    <span id="load-btn-text" class="hidden sm:inline">下載並載入</span>
                    <span id="load-btn-text-mobile" class="sm:hidden">載入</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 設定面板 -->
    <div id="settings-panel" class="hidden bg-slate-800 border-b border-slate-700 p-4 shadow-inner flex-shrink-0 transition-all z-0">
        <div class="flex flex-col sm:flex-row gap-6 sm:gap-8">
            <div class="flex-1">
                <div class="flex justify-between mb-2">
                    <label class="text-xs sm:text-sm font-medium text-slate-300">Temperature (隨機性)</label>
                    <!-- 修改 1：將顯示文字改為 0.1 -->
                    <span id="temp-val" class="text-xs sm:text-sm font-bold text-blue-400">0.1</span>
                </div>
                <!-- 修改 2：將 value 改為 0.0 -->
                <input type="range" id="temp-slider" min="0" max="2" step="0.1" value="0.0" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>
            <div class="flex-1">
                <div class="flex justify-between mb-2">
                    <label class="text-xs sm:text-sm font-medium text-slate-300">Top P (核取樣)</label>
                    <!-- 修改 3：若需更改 Top P 預設值，改這裡的文字 (目前維持 0.9) -->
                    <span id="top-p-val" class="text-xs sm:text-sm font-bold text-blue-400">0.9</span>
                </div>
                <!-- 修改 4：若需更改 Top P 預設值，改這裡的 value (目前維持 0.9) -->
                <input type="range" id="top-p-slider" min="0" max="1" step="0.05" value="0.9" class="w-full h-2 bg-slate-600 rounded-lg appearance-none cursor-pointer accent-blue-500">
            </div>
        </div>
    </div>

    <!-- 錯誤提示 -->
    <div id="error-banner" class="hidden bg-red-900/50 border-l-4 border-red-500 p-3 m-3 rounded-r w-auto flex-shrink-0 z-0">
        <div class="flex items-center gap-2 text-red-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
            <p id="error-text" class="text-xs sm:text-sm break-words whitespace-pre-wrap">發生錯誤</p>
        </div>
    </div>

    <!-- 對話視窗區 -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-3 sm:p-4 md:p-6 scroll-smooth z-0">
        <div class="flex flex-col gap-4 sm:gap-6 relative" id="messages-area">
            
            <div id="empty-state" class="flex flex-col items-center justify-center h-full text-slate-500 mt-10 space-y-3 px-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="opacity-50 sm:w-12 sm:h-12"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                <div class="text-sm sm:text-base text-center leading-relaxed">
                    請在上方點擊「載入」按鈕。<br/>
                    <span class="text-xs sm:text-sm text-slate-400">首次載入需下載數 GB 檔案，建議使用 Wi-Fi 環境。</span><br/>
                </div>
            </div>

            <div id="loading-indicator" class="hidden bg-slate-800 rounded-xl p-5 sm:p-6 flex-col items-center justify-center space-y-3 border border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.1)]">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-400 animate-spin sm:w-8 sm:h-8"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                <h3 class="text-base font-medium text-slate-200">準備模型環境中</h3>
                <p id="progress-text" class="text-xs sm:text-sm text-blue-300 font-mono text-center break-all max-w-2xl px-2">啟動中...</p>
                <div class="w-full max-w-md bg-slate-700 rounded-full h-1.5 mt-2 overflow-hidden">
                    <div class="bg-blue-500 h-1.5 rounded-full relative overflow-hidden progress-bar-fill"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- 底部輸入列 -->
    <footer class="bg-slate-800 border-t border-slate-700 p-3 sm:p-4 pb-safe flex-shrink-0 z-10">
        <div class="relative flex items-end gap-2">
            
            <div id="continue-wrapper" class="hidden absolute -top-14 left-0 w-full flex justify-center z-20 pointer-events-none">
                <button id="continue-btn" class="pointer-events-auto flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 px-4 py-2 rounded-full text-xs shadow-lg transition-transform active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    繼續回覆
                </button>
            </div>

            <textarea id="chat-input" disabled placeholder="請先載入模型..." class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-xl px-4 py-3 min-h-[48px] max-h-[150px] sm:max-h-[200px] resize-none focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 text-sm sm:text-base overflow-y-auto custom-scrollbar" rows="1"></textarea>
            
            <button id="send-btn" disabled class="flex-shrink-0 bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white p-3 rounded-xl transition-colors h-[48px] w-[48px] flex items-center justify-center active:scale-95">
                <svg id="send-icon-default" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                <svg id="send-icon-loading" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden animate-spin"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                <svg id="send-icon-stop" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="hidden"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
            </button>
        </div>
    </footer>
</div>

<!-- 1. 必須先宣告 FAQ 資料路徑 -->
<script>
    window.FAQ_DATA_URL = "{{ '/web-LLM/data/faq.json' | relative_url }}";
</script>

<!-- 2. 再引入主程式 -->
<script type="module" src="{{ '/web-LLM/js/main.js' | relative_url }}"></script>
