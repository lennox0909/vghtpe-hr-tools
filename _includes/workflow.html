<section class="bg-white rounded-[2.5rem] p-10 md:p-16 shadow-xl shadow-slate-200/60 border border-slate-100 mb-24">
    <div class="flex flex-col md:flex-row md:items-start justify-between mb-16 gap-8">
        <div class="text-left">
            <!-- 改用 include.data 接收外部傳入的參數 -->
            <h2 class="text-3xl font-bold mb-4 text-slate-900">{{ include.data.header.title }}</h2>
            <p class="text-slate-500 max-w-2xl">{{ include.data.header.description }}</p>
        </div>
        
        <a href="{{ include.data.header.url | relative_url }}"
           target="_blank"
           class="px-6 py-3 bg-slate-900 text-white rounded-xl text-sm font-bold hover:bg-slate-800 transition-all flex items-center shadow-lg shadow-slate-200 active:scale-95 shrink-0">
            {{ include.data.header.button_text }} <i class="fa-solid fa-arrow-up-right-from-square ml-2 text-xs"></i>
        </a>
    </div>

    <div class="flex flex-col md:flex-row gap-8 relative z-10 w-full">
        <!-- 迴圈改為讀取 include.data.steps -->
        {% for step in include.data.steps %}
        <div class="workflow-step relative text-center flex-1">
            <div class="w-16 h-16 bg-{{ step.color_theme }} text-white rounded-full flex items-center justify-center mx-auto mb-6 shadow-lg relative z-20">
                <i class="fa-solid {{ step.icon }} text-xl"></i>
            </div>
            <h4 class="font-bold text-slate-800 mb-2">{{ step.title }}</h4>
            <p class="text-sm text-slate-500 px-4">{{ step.description }}</p>
        </div>
        {% endfor %}
    </div>
</section>
