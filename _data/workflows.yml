# 工作流區塊：AI智慧小幫手
auto-reply:
  header:
    title: "AI 智慧小幫手"
    description: "結合 WebGPU 瀏覽器地端推論與 RAG 檢索技術，兼顧資料隱私與離線可用性，提供全天候即時人事規章諮詢。"
    button_text: "了解更多"
    url: "/web-LLM/user-guide/"
  steps:
    - title: WebGPU 地端輕量模型
      icon: fa-microchip
      color_theme: blue-600
      description: 採用 Google Gemma 2 等開源輕量模型，透過 WebGPU 硬體加速，一般行政文書電腦即可流暢執行本地推論。

    - title: 人事 FAQ 知識庫同步
      icon: fa-database
      color_theme: indigo-500
      description: 連線時自動載入並快取最新版人事室 FAQ 結構化語料，支援離線瀏覽，確保法規與福利資訊即時準確。

    - title: 精準語料檢索 (RAG)
      icon: fa-magnifying-glass-chart
      color_theme: cyan-500
      description: 先透過本地端關鍵字與語意權重演算法鎖定高關聯條文，再交由模型總結，減輕運算負擔與 AI 幻覺。

    - title: 智慧推薦與秒級秒回
      icon: fa-bolt
      color_theme: emerald-500
      description: 內建動態問題推薦機制，無須等待模型長篇生成即可一鍵點選常見問答，極小化 Token 消耗並加速查詢體驗。

# 工作流區塊：系統重構
refactor:
  header:
    title: "系統重構工作流"
    description: "循序漸進的數位轉型藍圖，確保人事系統從舊有架構平穩遷移至現代化平台。"
    button_text: "查看完整設計細節"
    url: "/system-refactoring/"
  steps:
    - title: 流程現況盤點
      icon: fa-magnifying-glass
      color_theme: blue-600
      description: 釐清既有行政作業瓶頸，識別自動化需求優先順序。

    - title: 業務模組拆解
      icon: fa-cubes
      color_theme: indigo-500
      description: 將龐雜人事規章拆解為獨立邏輯模組，降低耦合度。

    - title: 自動化邏輯導入
      icon: fa-robot
      color_theme: cyan-500
      description: 導入現代化程式架構與 API，實現跨系統數據即時交換。

    - title: 持續驗證與部署
      icon: fa-circle-check
      color_theme: emerald-500
      description: 透過單元測試與部署，確保核心作業零風險轉型。

