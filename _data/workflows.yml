# 工作流區塊：AI智慧小幫手
auto-service:
  header:
    title: "人事室AI智慧小幫手"
    description: "透過【地端(可離線使用)】AI或自動化系統，提供全天候院內、院外即時諮詢。"
    button_text: "查看使用方式與設計細節"
    url: "/auto-reply/"
  steps:
    - title: 使用開源小模型
      icon: fa-magnifying-glass
      color_theme: blue-600
      description: 使用 Google 提供的 Gemma2 小模型，藉由 WebGPU 技術，讓同仁以文書桌機/筆電，順跑 AI 助理。

    - title: 打包人事室 FAQ 資料
      icon: fa-magnifying-glass
      color_theme: blue-600
      description: 當您連線時，瀏覽器會下載最新版的 FAQ 資料，最新訊息不落人後。

    - title: 語料比對演算法
      icon: fa-magnifying-glass
      color_theme: blue-600
      description: 使用比對與排序演算法，減輕 LLM 語言模型負擔，同步檢驗 LLM 幻覺。

    - title: 減少 Token，降低算力需求
      icon: fa-magnifying-glass
      color_theme: blue-600
      description: 小語言模型生成速度慢，沒關係！使用推薦演算法，引導使用者快速得到答覆。

# 工作流區塊：系統重構
refactor:
  header:
    title: "系統重構工作流"
    description: "循序漸進的數位轉型藍圖，確保人事系統從舊有架構平穩遷移至現代化平台。"
    button_text: "查看完整設計細節"
    url: "/system-refactoring/"
  steps:
    - title: 流程現況盤點
      icon: fa-magnifying-glass
      color_theme: blue-600
      description: 釐清既有行政作業瓶頸，識別自動化需求優先順序。

    - title: 業務模組拆解
      icon: fa-cubes
      color_theme: indigo-500
      description: 將龐雜人事規章拆解為獨立邏輯模組，降低耦合度。

    - title: 自動化邏輯導入
      icon: fa-robot
      color_theme: cyan-500
      description: 導入現代化程式架構與 API，實現跨系統數據即時交換。

    - title: 持續驗證與部署
      icon: fa-circle-check
      color_theme: emerald-500
      description: 透過單元測試與部署，確保核心作業零風險轉型。

