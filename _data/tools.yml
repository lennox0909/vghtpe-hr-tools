# fa-brain
# fa-business-time (公事包 + 時鐘)：最強烈暗示「工作與工時」，非常適合加班主題。
# fa-file-invoice-dollar (文件 + 金錢)：強調「費用計算與請款單」的意象。
# fa-hand-holding-dollar (手捧金錢)：強調「計算並發放加班費」。
# fa-user-clock (人物 + 時鐘)：強調「員工出勤與工時紀錄」。
# fa-coins 或 fa-sack-dollar：最直觀的「金錢/薪資」圖示。


# 1. 通用與長條圖 (最直觀的統計圖)
# fa-chart-simple：極簡的三根長條圖（粗線條，現代感十足，推薦首選）。

# fa-chart-bar：標準長條圖（帶有 X/Y 軸的經典圖示）。

# fa-chart-column：直立式長條圖。

# 2. 趨勢與折線圖 (適合表現時間序列、業績變化)
# fa-chart-line：向上攀升的折線圖（帶有強烈的「成長、分析、趨勢」意象）。

# fa-chart-area：面積圖（折線圖下方帶有填滿效果）。

# 3. 分佈與圓餅圖 (適合表現比例)
# fa-chart-pie：標準圓餅圖（切出一角的圓餅，適合比例、資料分佈）。

# 4. 流程與關聯圖 (如果是針對 Mermaid 圖表編輯器特別推薦)
# fa-diagram-project：專案架構圖 / 樹狀圖（非常適合用來代表流程圖、組織圖）。

# fa-network-wired：網路關聯圖（適合複雜的心智圖或架構圖）。