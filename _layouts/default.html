<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title | default: "人事室智慧工具箱 - 臺北榮民總醫院" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 在 <head> 標籤內替換 CSS 引入方式 -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- 在 </body> 標籤前替換 JS 引入方式 -->
    <script src="{{ '/assets/js/app.js' | relative_url }}"></script>
    
    <!-- 加上 site.baseurl 確保 GitHub Pages 找得到 CSS -->
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    
    {% include navbar.html %}
    
    {{ content }}
    
    <footer class="py-16 text-center border-t border-slate-200 mt-12 bg-white">
        <p class="text-slate-500 text-sm font-medium">© 2026 臺北榮民總醫院 人事室</p>
        <p class="text-slate-400 text-[11px] mt-2 uppercase tracking-widest">Designed for Healthcare Excellence</p>
    </footer>

    <!-- 加上 site.baseurl 確保 GitHub Pages 找得到 JS -->
    <script src="{{ site.baseurl }}/assets/js/app.js"></script>
</body>
</html>
